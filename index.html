<body class="route-home">

    <div class="top-module-progress" id="top-module-progress" hidden aria-live="polite">

      <span></span><span></span><span></span>

      <div class="sidebar-actions">
        <button class="reset-progress" id="reset-progress" type="button">Reset training progress</button>
        <small>Only this device is affected.</small>
      </div>
    </aside>
    <button class="sidebar-scrim" id="sidebar-scrim" type="button" aria-label="Close handbook navigation"></button>
